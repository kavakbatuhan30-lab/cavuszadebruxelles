<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#3B1E08">
<!-- Fiyatlar kesinlesene kadar arama motorlarina kapali. Yayina hazir oldugunda bu satiri sil. -->
<meta name="robots" content="noindex, nofollow">
<title>Çavuşzade Baklava — Menü</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,600&family=Cinzel:wght@400;500;600&family=Playfair+Display:ital,wght@1,400&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

  :root{
    --gold:#C9A84C; --gold-light:#E8D08A; --gold-dark:#8B6520; --gold-deep:#6B4E15;
    --brown:#3B1E08; --brown-mid:#6B3A1F; --brown-warm:#4A2510;
    --cream:#FAF5EC; --cream-dark:#F0E8D5; --cream-warm:#F5EBD6;
    --charcoal:#1A0E05; --ink:#0F0803;
    --pistachio:#8FA968;
    --shadow-sm:0 1px 3px rgba(59,30,8,.10), 0 1px 2px rgba(59,30,8,.06);
    --shadow-md:0 4px 14px rgba(59,30,8,.12), 0 2px 4px rgba(59,30,8,.06);
    --shadow-lg:0 14px 40px rgba(59,30,8,.18), 0 6px 14px rgba(59,30,8,.10);
    --shadow-warm:0 10px 30px rgba(139,101,32,.20);
    --grain: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .23  0 0 0 0 .12  0 0 0 0 .03  0 0 0 .07 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
    --ease-out-quart: cubic-bezier(.25,1,.5,1);
    --ease-out-expo: cubic-bezier(.19,1,.22,1);
    --ease-out: cubic-bezier(.23,1,.32,1);        /* standart arayuz egrisi */
    --ease-in-out: cubic-bezier(.77,0,.175,1);    /* ekran icinde yer degistirme */
  }

  html{-webkit-text-size-adjust:100%; scroll-behavior:smooth}
  body{
    background:var(--cream); color:var(--brown);
    font-family:'Lato',sans-serif; font-weight:400;
    line-height:1.5; overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
    position:relative;
  }
  /* Sicak, kagit dokusu: butun sayfada dusuk yogunlukta */
  body::before{
    content:''; position:fixed; inset:0; pointer-events:none; z-index:5;
    background-image:var(--grain);
    opacity:.55; mix-blend-mode:multiply;
  }

  ::selection{background:var(--gold); color:var(--brown)}

  /* ---------- Acilis: dil secimi ---------- */
  #splash{
    position:fixed; inset:0; z-index:100;
    background:
      radial-gradient(ellipse at 50% 30%, rgba(201,168,76,.15) 0%, transparent 55%),
      linear-gradient(160deg,#3B1E08 0%,#1A0E05 100%);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:28px 22px calc(28px + env(safe-area-inset-bottom));
    text-align:center;
    transition:opacity .52s var(--ease-out-expo), visibility .52s var(--ease-out-expo);
    overflow:hidden;
  }
  /* ---------- Arka plan: donen baklava halkasi ----------
     Kaynak 4:3 ve fonu siyah. 'screen' karisimi siyahi tamamen dusuruyor;
     boylece altindaki kahve gradyan bozulmadan kaliyor, sadece tabaklar suzuluyor. */
  #splash .bgvid{
    position:absolute; inset:0; z-index:0; overflow:hidden; pointer-events:none;
  }
  #splash .bgvid video{
    position:absolute; top:50%; left:50%;
    width:min(155vw, 128vh); height:auto;
    transform:translate(-50%,-50%);
    mix-blend-mode:screen;
    opacity:.55;
  }
  /* Not: burada opaklik JS'e bagli DEGIL. Poster zaten videonun 0. karesi,
     dolayisiyla posterden ilk kareye gecis zaten kusursuz. Opakligi bir
     JS sinifina baglamak, video oynamadigi her durumda (otomatik oynatma
     engeli, azaltilmis hareket, veri tasarrufu) posteri de gorunmez yapiyordu. */
  /* Icerik sutununu karart: altin yazi ve dil dugmeleri her zaman okunakli kalsin.
     Halkanin disi acikta kalir, tabaklar kenarlarda suzulmeye devam eder. */
  #splash .bgvid::after{
    content:''; position:absolute; inset:0; pointer-events:none;
    background:radial-gradient(ellipse 70% 55% at 50% 48%,
      rgba(26,14,5,.88) 0%, rgba(26,14,5,.72) 38%,
      rgba(26,14,5,.32) 68%, rgba(26,14,5,0) 100%);
  }

  /* Kose sus: Osmanli motif ilhami, cok yumusak.
     Once sirayla belirir, sonra hep birlikte nefes alir. */
  #splash .corner{
    position:absolute; width:82px; height:82px; opacity:.42;
    color:var(--gold);
    animation:cornerIn .8s var(--ease-out-expo) backwards,
              cornerGlow 5.5s ease-in-out 1.1s infinite;
  }
  #splash .corner.tl{top:18px; left:18px; animation-delay:.06s, 1.1s}
  #splash .corner.tr{top:18px; right:18px; transform:scaleX(-1); animation-delay:.12s, 1.1s}
  #splash .corner.bl{bottom:18px; left:18px; transform:scaleY(-1); animation-delay:.18s, 1.1s}
  #splash .corner.br{bottom:18px; right:18px; transform:scale(-1,-1); animation-delay:.24s, 1.1s}
  @keyframes cornerIn{ from{opacity:0} }
  @keyframes cornerGlow{
    0%,100%{opacity:.32}
    50%{opacity:.55}
  }
  /* Yavas gezen altin isik */
  #splash::after{
    content:''; position:absolute; inset:-40%; pointer-events:none;
    background:conic-gradient(from 0deg, transparent 0%, rgba(232,208,138,.06) 12%, transparent 24%, transparent 100%);
    animation:goldSweep 22s linear infinite;
  }
  @keyframes goldSweep{to{transform:rotate(360deg)}}

  /* Cikis: perde yukari kalkar, menu altindan yerine oturur.
     Girdigi yonun tersine gider — icerik yukselerek uzaklasir. */
  #splash.hide{opacity:0; visibility:hidden}
  #splash.hide::after{animation-play-state:paused}
  #splash.hide .corner{animation:none; opacity:0; transition:opacity .24s var(--ease-out)}
  #splash.hide .inner{opacity:0; transform:translateY(-14px) scale(1.045)}

  #splash .inner{
    position:relative; z-index:2; display:flex; flex-direction:column; align-items:center;
    transition:transform .5s var(--ease-out-expo), opacity .34s var(--ease-out);
  }

  /* Logo: arkasinda gecikmeli acilan sicak bir isik */
  #splash .logo-wrap{
    position:relative; margin-bottom:22px;
    display:flex; align-items:center; justify-content:center;
  }
  #splash .logo-wrap::before{
    content:''; position:absolute; inset:-42%; pointer-events:none;
    background:radial-gradient(circle at 50% 50%, rgba(201,168,76,.30) 0%, rgba(201,168,76,.10) 38%, transparent 66%);
    opacity:1; transform:none;
    animation:glowBloom 1.4s var(--ease-out-expo) .28s backwards;
  }
  @keyframes glowBloom{ from{opacity:0; transform:scale(.55)} }

  #splash img.logo{
    width:132px; max-width:46vw; border-radius:12px; display:block;
    box-shadow:0 8px 30px rgba(0,0,0,.5), 0 0 0 1px rgba(201,168,76,.25) inset;
    position:relative; z-index:1;
    opacity:1; transform:none;
    animation:logoIn .95s var(--ease-out-expo) .06s backwards;
  }
  @keyframes logoIn{ from{opacity:0; transform:translateY(18px) scale(.92)} }

  /* Kelime isareti: harfler asagidan "perde arkasindan" yukselir.
     Kirpma isini sarmalayici yapar; h1'in altin gradyanina hic dokunmuyoruz
     (iOS Safari'de background-clip:text baska efektlerle kirilgan). */
  #splash .wordmark{
    overflow:hidden;
    padding:0 4px 8px; margin:0 -4px -8px;
  }
  #splash h1{
    font-family:'Cinzel',serif; font-weight:600;
    font-size:clamp(21px,6.4vw,30px);
    letter-spacing:4px; line-height:1.25;
    background:linear-gradient(120deg, var(--gold-light) 0%, #FFF3C8 45%, var(--gold) 55%, var(--gold-light) 100%);
    background-size:200% 100%; background-position:200% 0;
    -webkit-background-clip:text; background-clip:text; color:transparent;
    transform:none;
    animation:wordmarkIn .9s var(--ease-out-expo) .34s backwards,
              shimmer 6s linear 1.2s infinite;
  }
  @keyframes wordmarkIn{ from{transform:translateY(130%)} }
  @keyframes shimmer{
    0%{background-position:200% 0}
    100%{background-position:-200% 0}
  }

  #splash .tag{
    font-size:9.5px; letter-spacing:3.8px; color:var(--gold);
    opacity:1; margin-top:11px; text-transform:uppercase;
    animation:fadeUp .6s var(--ease-out-expo) .70s backwards;
  }

  /* Ornamental rule with center diamond */
  /* Susleme cizgisi: elmas once yerine oturur, cizgiler ondan disa dogru cizilir */
  #splash .orn-rule{
    display:flex; align-items:center; justify-content:center; gap:9px;
    margin:22px auto 20px;
  }
  #splash .orn-rule .line{
    display:block; width:56px; height:1px; flex:0 0 56px;
    background:linear-gradient(90deg, transparent, var(--gold) 50%, transparent);
    opacity:.7; transform:none;
    animation:ruleDraw .8s var(--ease-out-expo) .84s backwards;
  }
  #splash .orn-rule .line:first-child{transform-origin:100% 50%}
  #splash .orn-rule .line:last-child{transform-origin:0 50%}
  @keyframes ruleDraw{ from{opacity:0; transform:scaleX(0)} }

  #splash .orn-rule .dot{
    width:5px; height:5px; flex:0 0 5px;
    background:var(--gold); opacity:.75;
    transform:rotate(45deg);
    animation:diamondIn .7s var(--ease-out-expo) .76s backwards;
  }
  @keyframes diamondIn{ from{opacity:0; transform:rotate(-45deg) scale(.4)} }

  #splash .pick{
    font-family:'Playfair Display', serif; font-style:italic;
    font-size:13px; letter-spacing:.5px; color:var(--gold-light);
    opacity:1; margin-bottom:20px;
    animation:fadeUp .6s var(--ease-out-expo) .96s backwards;
  }

  .langgrid{
    display:grid; grid-template-columns:1fr 1fr; gap:12px;
    width:100%; max-width:340px;
  }
  .langbtn{
    display:flex; align-items:center; gap:11px;
    background:rgba(250,245,236,.06);
    border:1px solid rgba(201,168,76,.4);
    border-radius:12px; padding:13px 14px; cursor:pointer;
    color:var(--cream); font-family:'Lato',sans-serif; font-size:14px;
    letter-spacing:.3px;
    transition:background .28s ease, border-color .28s ease, box-shadow .28s ease,
               transform .14s var(--ease-out);
    -webkit-tap-highlight-color:transparent;
    opacity:1; transform:none;
    animation:btnIn .55s var(--ease-out-expo) backwards;
    position:relative; overflow:hidden;
  }
  @keyframes btnIn{ from{opacity:0; transform:translateY(14px) scale(.97)} }
  .langbtn::after{
    content:''; position:absolute; inset:0;
    background:linear-gradient(120deg, transparent 30%, rgba(232,208,138,.18) 50%, transparent 70%);
    transform:translateX(-120%); transition:transform .6s var(--ease-out-quart);
    pointer-events:none;
  }
  /* 60ms kademe: hepsi ayni anda gelmesin */
  .langbtn:nth-child(1){animation-delay:1.06s}
  .langbtn:nth-child(2){animation-delay:1.12s}
  .langbtn:nth-child(3){animation-delay:1.18s}
  .langbtn:nth-child(4){animation-delay:1.24s}

  .langbtn:active{transform:scale(.96)}
  /* Secildi: menu acilmadan once dokunusu onaylayan kisa parilti */
  .langbtn.chosen{
    background:rgba(201,168,76,.30); border-color:var(--gold-light);
    box-shadow:0 0 0 1px rgba(232,208,138,.55) inset, 0 8px 26px rgba(201,168,76,.28);
    transform:scale(.97);
  }
  .langbtn.chosen::after{transform:translateX(120%)}

  /* Dokunmatikte tap sahte :hover tetikler — sadece gercek imlecte ac */
  @media (hover:hover) and (pointer:fine){
    .langbtn:hover{
      background:rgba(201,168,76,.18); border-color:var(--gold);
      box-shadow:0 6px 20px rgba(201,168,76,.15);
    }
    .langbtn:hover::after{transform:translateX(120%)}
  }
  .langbtn svg{
    width:31px; height:21px; border-radius:2.5px; flex-shrink:0;
    box-shadow:0 1px 4px rgba(0,0,0,.45);
  }

  @keyframes fadeUp{
    from{opacity:0; transform:translateY(12px)}
  }

  /* Dil degistirme tekrarlanan bir islem — gorkemli acilis sadece ilk sefere ait.
     Yeniden acilista tum kademeler iptal, hizli ve sade bir gecis. */
  #splash.instant, #splash.instant .inner{transition:none}
  #splash.reopen{transition-duration:.24s}
  #splash.reopen .inner{transition-duration:.26s}
  #splash.reopen .corner,
  #splash.reopen .logo-wrap::before,
  #splash.reopen img.logo,
  #splash.reopen h1,
  #splash.reopen .tag,
  #splash.reopen .orn-rule .line,
  #splash.reopen .orn-rule .dot,
  #splash.reopen .pick,
  #splash.reopen .langbtn{animation:none}

  /* Menu devir teslimi: perde kalkarken ust bar ve sekmeler yerine oturur */
  body.menu-in header{animation:menuHeaderIn .5s var(--ease-out-expo) .1s backwards}
  body.menu-in nav.tabs{animation:menuRise .55s var(--ease-out-expo) .18s backwards}
  @keyframes menuHeaderIn{ from{opacity:0; transform:translateY(-14px)} }
  @keyframes menuRise{ from{opacity:0; transform:translateY(14px)} }

  /* ---------- Ust bar ---------- */
  header{
    background:linear-gradient(180deg, #3B1E08 0%, #331808 100%);
    color:var(--gold-light);
    padding:calc(11px + env(safe-area-inset-top)) 16px 11px;
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    position:sticky; top:0; z-index:30;
    transition:box-shadow .3s ease;
    border-bottom:1px solid rgba(201,168,76,.14);
  }
  header.scrolled{box-shadow:0 6px 24px rgba(26,14,5,.35)}
  header::before{
    content:''; position:absolute; inset:0; pointer-events:none;
    background:linear-gradient(90deg, transparent 0%, rgba(201,168,76,.06) 50%, transparent 100%);
  }
  header .brand{
    font-family:'Cinzel',serif; font-size:15.5px; letter-spacing:2.6px; line-height:1.15;
    display:flex; align-items:center; gap:9px;
    position:relative; z-index:1;
  }
  header .brand::before{
    content:''; display:block; width:5px; height:5px; transform:rotate(45deg);
    background:var(--gold); opacity:.85;
  }
  header .brand-text{display:flex; flex-direction:column}
  header .brand small{
    display:block; font-family:'Lato',sans-serif; font-size:8px;
    letter-spacing:3.5px; opacity:.65; margin-top:3px; font-weight:300;
  }
  #langToggle{
    display:flex; align-items:center; gap:7px; cursor:pointer;
    background:rgba(250,245,236,.09);
    border:1px solid rgba(201,168,76,.38);
    border-radius:22px; padding:6px 12px 6px 8px; color:var(--gold-light);
    font-family:'Lato',sans-serif; font-size:11px; letter-spacing:1.3px; font-weight:700;
    -webkit-tap-highlight-color:transparent;
    transition:background .22s ease, border-color .22s ease, transform .12s ease;
    position:relative; z-index:1;
  }
  #langToggle:active{transform:scale(.96)}
  #langToggle:hover{background:rgba(201,168,76,.16); border-color:var(--gold)}
  #langToggle svg.flag{width:19px; height:13px; border-radius:2px; display:block}
  #langToggle .chev{width:9px; height:9px; opacity:.75; transition:transform .3s ease}
  #langToggle:hover .chev{transform:translateY(1px)}

  /* ---------- Sekmeler ---------- */
  nav.tabs{
    display:flex; background:var(--cream-dark);
    border-bottom:1px solid rgba(139,101,32,.2);
    position:sticky; top:0; z-index:20;
    box-shadow:0 1px 0 rgba(139,101,32,.06);
  }
  nav.tabs button{
    flex:1; border:0; background:none; cursor:pointer;
    padding:14px 6px 12px; font-family:'Lato',sans-serif;
    font-size:11.5px; letter-spacing:2px; text-transform:uppercase;
    color:var(--brown-mid);
    transition:color .22s ease;
    -webkit-tap-highlight-color:transparent;
    position:relative; font-weight:700;
  }
  nav.tabs button.on{color:var(--brown)}
  nav.tabs button:not(.on):hover{color:var(--brown-warm)}
  /* Kayan altin cizgi: iki sekme arasinda yumusakca gecer */
  nav.tabs .indicator{
    position:absolute; bottom:-1px; height:2.5px;
    background:linear-gradient(90deg, transparent 0%, var(--gold) 20%, var(--gold-light) 50%, var(--gold) 80%, transparent 100%);
    border-radius:2px;
    transition:left .45s var(--ease-out-expo), width .45s var(--ease-out-expo);
    will-change:left,width;
    box-shadow:0 0 12px rgba(201,168,76,.5);
  }

  main{padding-bottom:8px; position:relative}
  .panel{display:none}
  .panel.on{display:block; animation:panelIn .45s var(--ease-out-quart)}
  @keyframes panelIn{
    from{opacity:0; transform:translateY(8px)}
    to{opacity:1; transform:none}
  }

  .unitnote{
    text-align:center; font-family:'Playfair Display',serif; font-style:italic;
    font-size:13px; color:var(--brown-mid);
    padding:18px 18px 6px; opacity:.9; letter-spacing:.2px;
    display:flex; align-items:center; justify-content:center; gap:12px;
  }
  .unitnote::before, .unitnote::after{
    content:''; flex:0 0 22px; height:1px;
    background:linear-gradient(90deg, transparent, rgba(139,101,32,.4));
  }
  .unitnote::after{background:linear-gradient(90deg, rgba(139,101,32,.4), transparent)}

  /* ---------- Baklava izgarasi ---------- */
  .grid{
    display:grid; grid-template-columns:repeat(2,1fr); gap:12px;
    padding:14px 13px 24px; max-width:820px; margin:0 auto;
  }
  @media(min-width:620px){ .grid{grid-template-columns:repeat(3,1fr); gap:14px} }
  @media(min-width:860px){ .grid{grid-template-columns:repeat(4,1fr); max-width:1120px; gap:16px} }

  .card{
    background:#fff; border-radius:14px; overflow:hidden;
    box-shadow:var(--shadow-sm); cursor:pointer;
    transition:transform .35s var(--ease-out-quart), box-shadow .35s ease;
    -webkit-tap-highlight-color:transparent;
    position:relative;
    opacity:1; transform:none;
    border:1px solid rgba(139,101,32,.08);
  }
  /* Bitis degeri CSS'te durur, keyframe'de degil: boylece animasyon bittikten
     sonra :active / :hover donusumleri calisabiliyor (forwards onlari kilitliyordu). */
  .card:not(.reveal){opacity:0; transform:translateY(20px)}
  .card.reveal{
    animation:cardIn .8s var(--ease-out-expo) backwards;
  }
  @keyframes cardIn{
    from{opacity:0; transform:translateY(20px)}
  }
  .card:active{transform:scale(.97); box-shadow:var(--shadow-sm)}
  @media(hover:hover){
    .card:hover{
      transform:translateY(-4px);
      box-shadow:var(--shadow-lg);
      border-color:rgba(201,168,76,.35);
    }
    .card:hover .imgwrap img{transform:scale(1.06)}
    .card:hover .imgwrap::after{opacity:1}
  }
  .card .imgwrap{
    position:relative; overflow:hidden; background:var(--cream-dark);
  }
  .card .imgwrap::after{
    content:''; position:absolute; inset:0; pointer-events:none;
    background:linear-gradient(180deg, rgba(59,30,8,.12) 0%, transparent 30%, transparent 60%, rgba(201,168,76,.10) 100%);
    opacity:0; transition:opacity .4s ease;
  }
  .card img{
    width:100%; aspect-ratio:600/421; object-fit:cover;
    display:block; background:var(--cream-dark);
    transition:transform .8s var(--ease-out-quart);
  }
  .card .body{padding:11px 10px 12px; text-align:center; position:relative}
  .card .name{
    font-family:'Cormorant Garamond',serif; font-weight:600;
    font-size:16.5px; color:var(--brown); line-height:1.2;
    letter-spacing:.2px;
  }
  .card .desc{
    font-size:10.5px; color:var(--brown-mid); opacity:.85;
    line-height:1.4; margin-top:5px; min-height:28px;
    font-family:'Playfair Display',serif; font-style:italic;
    letter-spacing:.15px;
  }
  .card .price{
    font-size:14.5px; color:var(--gold-dark); font-weight:700; margin-top:8px;
    letter-spacing:.3px;
  }
  .card .price small{font-weight:400; font-size:9.5px; opacity:.85; letter-spacing:.4px}

  /* --- adet secici --- */
  .card .kgline{
    font-size:9.5px; color:var(--brown-mid); opacity:.7;
    margin-top:6px; line-height:1.35; letter-spacing:.25px;
  }
  .qty{
    display:flex; align-items:center; justify-content:center; gap:10px;
    margin-top:9px; padding-top:9px;
    border-top:1px solid rgba(139,101,32,.14);
  }
  .qty button{
    width:32px; height:32px; border-radius:50%; flex-shrink:0;
    border:1px solid rgba(139,101,32,.45); background:var(--cream);
    color:var(--brown); font-size:17px; line-height:1; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    font-family:'Lato',sans-serif; position:relative;
    transition:background .18s ease, border-color .18s ease, transform .12s ease;
    -webkit-tap-highlight-color:transparent;
  }
  .qty button::after{
    content:''; position:absolute; top:50%; left:50%;
    width:44px; height:44px; transform:translate(-50%,-50%);
  }
  .qty button:active{background:var(--gold-light); transform:scale(.92)}
  .qty button:hover:not(:disabled){border-color:var(--gold); background:var(--cream-warm)}
  .qty button:disabled{opacity:.3; cursor:default}
  .qty .n{
    min-width:22px; text-align:center; font-size:15px;

const FLAGS = {
  tr:'<svg viewBox="0 0 60 40" xmlns="http://www.w3.org/2000/svg"><rect width="60" height="40" fill="#E30A17"/><circle cx="25" cy="20" r="10" fill="#fff"/><circle cx="28.5" cy="20" r="8" fill="#E30A17"/><polygon fill="#fff" points="38,14 39.41,18.06 43.71,18.15 40.28,20.74 41.53,24.85 38,22.4 34.47,24.85 35.72,20.74 32.29,18.15 36.59,18.06"/></svg>',
  fr:'<svg viewBox="0 0 60 40" xmlns="http://www.w3.org/2000/svg"><rect width="20" height="40" fill="#002395"/><rect x="20" width="20" height="40" fill="#fff"/><rect x="40" width="20" height="40" fill="#ED2939"/></svg>',
  nl:'<svg viewBox="0 0 60 40" xmlns="http://www.w3.org/2000/svg"><rect width="60" height="13.34" fill="#AE1C28"/><rect y="13.34" width="60" height="13.33" fill="#fff"/><rect y="26.67" width="60" height="13.33" fill="#21468B"/></svg>',
  en:'<svg viewBox="0 0 60 40" xmlns="http://www.w3.org/2000/svg"><rect width="60" height="40" fill="#012169"/><path d="M0,0 L60,40 M60,0 L0,40" stroke="#fff" stroke-width="8"/><path d="M0,0 L60,40 M60,0 L0,40" stroke="#C8102E" stroke-width="4"/><path d="M30,0 V40 M0,20 H60" stroke="#fff" stroke-width="13"/><path d="M30,0 V40 M0,20 H60" stroke="#C8102E" stroke-width="7"/></svg>',
};

const LANGS = ['tr','fr','nl','en'];
const STORE_KEY = 'cz_lang';
let lang = 'tr';

/* Secilen adetler: { urunId: adet }. Dil degisince korunur. */
const QTY = {};
const MAX_QTY = 50;

/* ========================= YARDIMCILAR ========================= */

const $ = id => document.getElementById(id);

function money(n){
  /* Once kurusa yuvarla: 1.44*25 = 36.000000000000014 gibi kayan nokta artiklarini temizler */
  const v = Math.round(n * 100) / 100;
  /* Tam sayida kurus gosterme: 36 € ama 2,50 € */
  const dec = Number.isInteger(v) ? 0 : 2;
  return v.toLocaleString('fr-BE',{minimumFractionDigits:dec,maximumFractionDigits:2}) + ' €';
}
function qtyOf(id){ return QTY[id] || 1; }
function priceHtml(p){
  return p.unit === 'kg'
    ? `${money(p.price)}<small>${I18N[lang].perKg}</small>`
    : money(p.price);
}
function esc(s){
  return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}

/* ========================= RENDER ========================= */

function renderSplash(){
  $('langGrid').innerHTML = LANGS.map(l =>
    `<button class="langbtn" data-lang="${l}">${FLAGS[l]}<span>${I18N[l].label}</span></button>`
  ).join('');
  $('langGrid').querySelectorAll('.langbtn').forEach(b =>
    b.addEventListener('click', () => {
      /* Once dokunusu onayla (140ms), sonra perdeyi kaldir.
         Kararin yavas kismi kullanicida, sistemin cevabi hizli. */
      $('langGrid').querySelectorAll('.langbtn').forEach(o => o.classList.remove('chosen'));
      b.classList.add('chosen');
      setLang(b.dataset.lang);
      setTimeout(() => closeSplash(true), 150);
    })
  );
}

function renderMenu(){
  const t = I18N[lang];
  document.documentElement.lang = lang;

  $('tabBaklava').textContent = t.baklava;
  $('tabDrink').textContent   = t.drink;
  $('noteBaklava').textContent = t.noteKg;
  $('noteDrink').textContent   = t.notePc;
  $('curFlag').innerHTML = `<svg class="flag" viewBox="0 0 60 40">${FLAGS[lang].replace(/^<svg[^>]*>|<\/svg>$/g,'')}</svg>`;
  $('curCode').textContent = t.code;

  /* Baklava kartlari — pcs+piece varsa adet secici, yoksa sadece kilo fiyati */
  $('gridBaklava').innerHTML = PRODUCTS.filter(p => p.cat === 'baklava').map((p,i) => {
    const byPiece = !!(p.pcs && p.piece);
    const q = qtyOf(p.id);
    const media = `<div class="imgwrap"><img src="${p.img}" alt="${esc(p.name)}" ${i < 4 ? '' : 'loading="lazy"'} decoding="async"></div>`;
    const head  = `<div class="name">${esc(p.name)}</div>
        <div class="desc">${esc(p.desc[lang])}</div>`;

    const tail = byPiece ? `
        <div class="kgline">${money(p.price)}${t.perKg} &middot; ${t.pcsApprox.replace('{n}', p.pcs)}</div>
        <div class="qty">
          <button class="minus" data-id="${p.id}" aria-label="−" ${q <= 1 ? 'disabled' : ''}>&minus;</button>
          <span class="n" id="q-${p.id}">${q}</span>
          <button class="plus" data-id="${p.id}" aria-label="+">+</button>
        </div>
        <div class="total" id="t-${p.id}">${money(p.piece * q)}</div>`
      : `
        <div class="price">${money(p.price)}<small>${t.perKg}</small></div>`;

    return `<article class="card" data-id="${p.id}" style="--i:${i}">${media}<div class="body">${head}${tail}</div></article>`;
  }).join('');

  $('gridBaklava').querySelectorAll('.card').forEach(c =>
    c.addEventListener('click', () => openLightbox(c.dataset.id))
  );

  /* Adet dugmeleri: karta yayilirsa buyuk fotograf acilir, o yuzden durdur */
  $('gridBaklava').querySelectorAll('.qty button').forEach(b =>
    b.addEventListener('click', e => {
      e.stopPropagation();
      changeQty(b.dataset.id, b.classList.contains('plus') ? 1 : -1);
    })
  );

  /* Kartlar goruse geldikce sirayla belirir */
  revealCards();

  /* Icecek satirlari — fotografsiz */
  $('listDrink').innerHTML = PRODUCTS.filter(p => p.cat === 'drink').map(p => `
    <div class="drink">
      <span class="dn">${esc(p.name)}</span>
      <span class="dots"></span>
      <span class="dp">${priceHtml(p)}</span>
      <span class="dd">${esc(p.desc[lang])}</span>
    </div>`).join('');

  /* Iletisim */
  $('fTitle').textContent  = t.contact;
  $('lblAddr').textContent = t.addr;
  $('lblPhone').textContent= t.phone;
  $('lblHours').textContent= t.hours;
  $('hoursTable').innerHTML = t.days.map((d,i) =>
    i === 0
      ? `<tr class="closed"><td>${d}</td><td>${t.closed}</td></tr>`
      : `<tr><td>${d}</td><td>12:00 – 21:00</td></tr>`
  ).join('');

  $('yr').textContent = new Date().getFullYear();

  /* Aktif sekmenin altina kayan cizgiyi konumla */
  requestAnimationFrame(updateIndicator);
}

/* ========================= ETKILESIM ========================= */

function setLang(l){
  if(!I18N[l]) l = 'tr';
  lang = l;
  try{ localStorage.setItem(STORE_KEY, l); }catch(e){}
  renderMenu();
}

/* ========================= ARKA PLAN VIDEOSU =========================
   1.2 MB'lik halka sadece perde gercekten gorunecekse inisin. Kayitli dili
   olan ziyaretci perdeyi hic gormuyor — ona hic indirmiyoruz. */
let ringStarted = false;

function ringAllowed(){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches) return false;
  const c = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
  if(c){
    if(c.saveData) return false;                          /* veri tasarrufu acik */
    if(/(^|-)2g$/.test(c.effectiveType || '')) return false;  /* dukkanda kotu sebeke */
  }
  return true;
}

function startRing(){
  const v = $('ringVid');
  if(!v || ringStarted || !ringAllowed()) return;         /* izin yoksa poster kalir */
  ringStarted = true;
  v.src = v.dataset.src;
  const p = v.play();
  if(p && p.catch) p.catch(() => {});                     /* otomatik oynatma engellenirse sorun degil */
}

function resumeRing(){
  const v = $('ringVid');
  if(!v) return;
  if(!ringStarted){ startRing(); return; }
  const p = v.play();
  if(p && p.catch) p.catch(() => {});
}

/* Perde kalkarken menu ayni anda yerine otursun — bos bir capraz gecis degil,
   tek bir devir teslim hareketi. animated=false ise (kayitli dil) aninda gec. */
function closeSplash(animated){
  const s = $('splash');
  if(animated){
    document.body.classList.remove('menu-in');
    void document.body.offsetWidth;      /* reflow: animasyon bastan calissin */
    document.body.classList.add('menu-in');
    restageCards();
  }
  s.classList.add('hide');
  const v = $('ringVid');
  if(v && ringStarted) v.pause();        /* perde kapaliyken bosuna kare cozme */
}
function openSplash(){
  const s = $('splash');
  s.classList.add('reopen');             /* tekrar acilis: kademeli giris yok */
  s.querySelectorAll('.langbtn.chosen').forEach(b => b.classList.remove('chosen'));
  s.classList.remove('hide');
  resumeRing();
}

/* Kartlari basa sar ki perde kalkarken sirayla yeniden gelsinler */
function restageCards(){
  document.querySelectorAll('#gridBaklava .card').forEach(c => {
    c.classList.remove('reveal');
    c.style.animationDelay = '';
  });
  revealCards();
}

/* Adet degistir: sadece ilgili karti gunceller, sayfayi bastan cizmez */
function changeQty(id, delta){
  const p = PRODUCTS.find(x => x.id === id);
  if(!p || !p.piece) return;

  const q = Math.min(MAX_QTY, Math.max(1, qtyOf(id) + delta));
  QTY[id] = q;

  const nEl = $('q-' + id);
  const tEl = $('t-' + id);
  if(nEl){
    nEl.textContent = q;
    nEl.classList.remove('bump'); void nEl.offsetWidth; nEl.classList.add('bump');
  }
  if(tEl){
    tEl.innerHTML = money(p.piece * q);
    tEl.classList.remove('pulse'); void tEl.offsetWidth; tEl.classList.add('pulse');
  }

  const minus = document.querySelector(`.card[data-id="${id}"] .qty .minus`);
  if(minus) minus.disabled = (q <= 1);
}

function openLightbox(id){
  const p = PRODUCTS.find(x => x.id === id);
  if(!p) return;
  $('lbImg').src = p.img;
  $('lbImg').alt = p.name;
  $('lbName').textContent = p.name;
  $('lbDesc').textContent = p.desc[lang];
  if(p.piece){
    const q = qtyOf(p.id);
    $('lbPrice').innerHTML = `${money(p.piece * q)}<small> &middot; ${q} × ${money(p.piece)}</small>`;
  }else{
    $('lbPrice').innerHTML = priceHtml(p);
  }
  $('lightbox').classList.add('on');
}
function closeLightbox(){ $('lightbox').classList.remove('on'); }

/* Sekmeler + kayan gosterge */
function updateIndicator(){
  const active = document.querySelector('nav.tabs button.on');
  const ind = $('tabIndicator');
  if(!active || !ind) return;
  ind.style.left  = active.offsetLeft + 'px';
  ind.style.width = active.offsetWidth + 'px';
}

document.querySelectorAll('nav.tabs button').forEach(btn =>
  btn.addEventListener('click', () => {
    document.querySelectorAll('nav.tabs button').forEach(b => b.classList.remove('on'));
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('on'));
    btn.classList.add('on');
    $('panel-' + btn.dataset.cat).classList.add('on');
    updateIndicator();
    window.scrollTo({top:0, behavior:'smooth'});
  })
);
window.addEventListener('resize', updateIndicator);

$('langToggle').addEventListener('click', openSplash);
$('lbClose').addEventListener('click', closeLightbox);
$('lightbox').addEventListener('click', e => { if(e.target.id === 'lightbox') closeLightbox(); });
document.addEventListener('keydown', e => { if(e.key === 'Escape') closeLightbox(); });

/* Ust bar: scroll ederken hafif golge kazansin */
const topbar = $('topbar');
window.addEventListener('scroll', () => {
  topbar.classList.toggle('scrolled', window.scrollY > 4);
}, {passive:true});

/* Kartlar: goruse girdikce sirayla belir. Motion-safe. */
let cardObserver = null;
function revealCards(){
  const cards = document.querySelectorAll('#gridBaklava .card');
  if(!('IntersectionObserver' in window)){
    cards.forEach(c => c.classList.add('reveal'));
    return;
  }
  if(cardObserver) cardObserver.disconnect();
  cardObserver = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if(entry.isIntersecting){
        const card = entry.target;
        const i = parseInt(card.style.getPropertyValue('--i') || 0, 10);
        card.style.animationDelay = Math.min(i, 8) * 70 + 'ms';
        card.classList.add('reveal');
        cardObserver.unobserve(card);
      }
    });
  }, {rootMargin:'0px 0px -8% 0px', threshold:0.05});
  cards.forEach(c => cardObserver.observe(c));
}

/* ========================= BASLANGIC ========================= */

(function init(){
  renderSplash();

  let saved = null;
  try{ saved = localStorage.getItem(STORE_KEY); }catch(e){}

  /* ?splash ile perdeyi zorla goster: kayitli dili olan cihazda test/tanitim icin.
     Musteri akisi degismiyor — normal ziyarette dil bir kez soruluyor. */
  const forceSplash = /(^|[?&#])splash(&|=|$)/.test(location.search + location.hash);

  if(saved && I18N[saved] && !forceSplash){
    lang = saved;
    /* Ayni cihaz tekrar okuttu -> menuye dogrudan gir.
       Perde hic gorunmesin: gecisi kapat, kapat, bir kare sonra geri ac. */
    const s = $('splash');
    s.classList.add('instant');
    closeSplash(false);
    /* Gecisi geri ac. Sayfa arka planda acildiysa rAF donar (telefon QR'i arka
       sekmede acabiliyor) — o yuzden zamanlayici da yedekte dursun. */
    const thaw = () => s.classList.remove('instant');
    requestAnimationFrame(() => requestAnimationFrame(thaw));
    setTimeout(thaw, 120);
  } else {
    startRing();               /* perde gorunecek: halkayi simdi indir */
  }
  renderMenu();
})();
</script>
</body>
</html>
